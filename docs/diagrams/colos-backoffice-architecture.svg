<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" width="760" height="596" role="img" aria-label="Colos back office architecture" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Colos back office architecture</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8B5AD"/></marker></defs>
  <rect x="0" y="0" width="760" height="596" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1F1E1C">Colos back office architecture</text>
  <text x="24" y="54" font-size="11.5" font-weight="400" fill="#5E5D59">Prices, deals and invoices as built · red numbers mark the two invoice errors</text>
  <text x="24" y="86" font-size="11.5" font-weight="600" fill="#5E5D59">Prices, every week</text>
  <text x="24" y="196" font-size="11.5" font-weight="600" fill="#5E5D59">Deals</text>
  <text x="24" y="324" font-size="11.5" font-weight="600" fill="#5E5D59">Invoices</text>
  <path d="M184 124H208" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M368 124H392" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M552 124H576" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M184 244H208" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M368 244H392" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M576 244H552" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M188 420V376H208" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M188 420V472H208" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M520 424V376H368" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M520 424V472H368" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M168 420H188" fill="none" stroke="#B8B5AD" stroke-width="1.25"/>
  <path d="M576 424H520" fill="none" stroke="#B8B5AD" stroke-width="1.25"/>
  <rect x="24" y="96" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="40" y="120" font-size="13" font-weight="600" fill="#1F1E1C">Supplier websites</text>
  <text x="40" y="136" font-size="11.5" font-weight="400" fill="#5E5D59">prices change weekly</text>
  <rect x="208" y="96" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="224" y="120" font-size="13" font-weight="600" fill="#1F1E1C">Scraper</text>
  <text x="224" y="136" font-size="11.5" font-weight="400" fill="#5E5D59">cron job, Mon and Tue</text>
  <rect x="392" y="96" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="408" y="120" font-size="13" font-weight="600" fill="#1F1E1C">OpenAI model</text>
  <text x="408" y="136" font-size="11.5" font-weight="400" fill="#5E5D59">checks what changed</text>
  <rect x="24" y="216" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="40" y="240" font-size="13" font-weight="600" fill="#1F1E1C">Customer</text>
  <text x="40" y="256" font-size="11.5" font-weight="400" fill="#5E5D59">email or phone call</text>
  <rect x="208" y="200" width="160" height="88" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="224" y="224" font-size="13" font-weight="600" fill="#1F1E1C">OpenAI model</text>
  <text x="224" y="240" font-size="11.5" font-weight="400" fill="#5E5D59">negotiates the price</text>
  <text x="224" y="256" font-size="11.5" font-weight="400" fill="#5E5D59">researches the buyer</text>
  <text x="224" y="272" font-size="11.5" font-weight="400" fill="#5E5D59">picks the supplier</text>
  <rect x="392" y="200" width="160" height="88" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="408" y="224" font-size="13" font-weight="600" fill="#1F1E1C">Price rules</text>
  <text x="408" y="240" font-size="11.5" font-weight="400" fill="#5E5D59">code checks the floor</text>
  <text x="408" y="256" font-size="11.5" font-weight="400" fill="#5E5D59">below cost + $50: no</text>
  <text x="408" y="272" font-size="11.5" font-weight="400" fill="#5E5D59">discount: I approve</text>
  <rect x="24" y="384" width="144" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="40" y="408" font-size="13" font-weight="600" fill="#1F1E1C">Me</text>
  <text x="40" y="424" font-size="11.5" font-weight="400" fill="#5E5D59">trigger or approve</text>
  <text x="40" y="440" font-size="11.5" font-weight="400" fill="#5E5D59">every invoice</text>
  <rect x="208" y="332" width="160" height="88" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="224" y="356" font-size="13" font-weight="600" fill="#1F1E1C">Wire</text>
  <text x="224" y="372" font-size="11.5" font-weight="400" fill="#5E5D59">our Excel invoice,</text>
  <text x="224" y="388" font-size="11.5" font-weight="400" fill="#5E5D59">customer details and</text>
  <text x="224" y="404" font-size="11.5" font-weight="400" fill="#5E5D59">this order’s items</text>
  <rect x="208" y="436" width="160" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="224" y="460" font-size="13" font-weight="600" fill="#1F1E1C">Card</text>
  <text x="224" y="476" font-size="11.5" font-weight="400" fill="#5E5D59">Stripe invoice,</text>
  <text x="224" y="492" font-size="11.5" font-weight="400" fill="#5E5D59">sent through its API</text>
  <rect x="576" y="96" width="160" height="412" rx="8" fill="#2B78D0" fill-opacity="0.12" stroke="#2B78D0" stroke-width="2"/>
  <text x="592" y="120" font-size="13" font-weight="600" fill="#1F1E1C">Google Sheet</text>
  <text x="592" y="138" font-size="11.5" font-weight="400" fill="#1F1E1C">weekly inventory</text>
  <text x="592" y="154" font-size="11.5" font-weight="400" fill="#1F1E1C">and prices</text>
  <text x="592" y="170" font-size="11.5" font-weight="400" fill="#1F1E1C">customer details</text>
  <text x="592" y="186" font-size="11.5" font-weight="400" fill="#1F1E1C">notes on customers</text>
  <text x="592" y="210" font-size="11.5" font-weight="400" fill="#5E5D59">my code: Sheets API</text>
  <text x="592" y="300" font-size="11.5" font-weight="400" fill="#5E5D59">edited by the team</text>
  <text x="592" y="324" font-size="11.5" font-weight="400" fill="#5E5D59">read by the phone</text>
  <text x="592" y="340" font-size="11.5" font-weight="400" fill="#5E5D59">agent on calls</text>
  <text x="444" y="366" font-size="11.5" font-weight="400" fill="#5E5D59" text-anchor="middle">prices</text>
  <circle cx="168" cy="384" r="9" fill="#D14343" fill-opacity="0.18" stroke="#D14343" stroke-width="1.5"/><text x="168" y="388" font-size="11.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">1</text>
  <circle cx="548" cy="404" r="9" fill="#D14343" fill-opacity="0.18" stroke="#D14343" stroke-width="1.5"/><text x="548" y="408" font-size="11.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">2</text>
  <circle cx="33" cy="540" r="9" fill="#D14343" fill-opacity="0.18" stroke="#D14343" stroke-width="1.5"/><text x="33" y="544" font-size="11.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">1</text>
  <text x="52" y="544" font-size="11.5" font-weight="400" fill="#1F1E1C">A regular customer’s usual discount got skipped on an invoice.</text>
  <circle cx="33" cy="566" r="9" fill="#D14343" fill-opacity="0.18" stroke="#D14343" stroke-width="1.5"/><text x="33" y="570" font-size="11.5" font-weight="600" fill="#1F1E1C" text-anchor="middle">2</text>
  <text x="52" y="570" font-size="11.5" font-weight="400" fill="#1F1E1C">An invoice went out before that week’s price update, and we lost money on it.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
