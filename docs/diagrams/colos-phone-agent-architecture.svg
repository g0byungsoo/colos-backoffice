<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" role="img" aria-label="Colos phone agent architecture" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Colos phone agent architecture</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8B5AD"/></marker></defs>
  <rect x="0" y="0" width="760" height="556" fill="#FFFFFF"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1F1E1C">Colos phone agent architecture</text>
  <text x="24" y="54" font-size="11.5" font-weight="400" fill="#5E5D59">Inbound calls as built · about 10 to 30 calls a day</text>
  <path d="M152 120H184" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M456 120H504" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M320 156V196" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M320 252V292" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M192 368H216" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M368 368H392" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M544 368H568" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <path d="M468 460V404" fill="none" stroke="#B8B5AD" stroke-width="1.25" marker-end="url(#arrow)"/>
  <rect x="24" y="84" width="128" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="88" y="108" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Caller</text>
  <text x="88" y="124" font-size="11.5" font-weight="400" fill="#5E5D59" text-anchor="middle">customers,</text>
  <text x="88" y="140" font-size="11.5" font-weight="400" fill="#5E5D59" text-anchor="middle">depots, suppliers</text>
  <rect x="184" y="84" width="272" height="72" rx="8" fill="#2B78D0" fill-opacity="0.12" stroke="#2B78D0" stroke-width="2"/>
  <text x="200" y="108" font-size="13" font-weight="600" fill="#1F1E1C">Routing rule</text>
  <text x="200" y="124" font-size="11.5" font-weight="400" fill="#1F1E1C">Saved number and 8am to 6pm: my phone</text>
  <text x="200" y="140" font-size="11.5" font-weight="400" fill="#1F1E1C">Everything else: the agent</text>
  <rect x="504" y="84" width="232" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="520" y="108" font-size="13" font-weight="600" fill="#1F1E1C">My phone</text>
  <text x="520" y="124" font-size="11.5" font-weight="400" fill="#5E5D59">known customers, during the day</text>
  <text x="520" y="140" font-size="11.5" font-weight="400" fill="#5E5D59">all calls, once I pulled it</text>
  <rect x="232" y="196" width="176" height="56" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="320" y="220" font-size="13" font-weight="600" fill="#1F1E1C" text-anchor="middle">Twilio number</text>
  <text x="320" y="236" font-size="11.5" font-weight="400" fill="#5E5D59" text-anchor="middle">the agent’s phone line</text>
  <text x="330" y="276" font-size="11.5" font-weight="400" fill="#5E5D59">call audio</text>
  <rect x="24" y="292" width="712" height="128" rx="8" fill="#EFEEEA" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="40" y="316" font-size="13" font-weight="600" fill="#1F1E1C">ElevenLabs agent</text>
  <text x="172" y="316" font-size="11.5" font-weight="400" fill="#5E5D59">their platform ran the whole turn</text>
  <rect x="40" y="332" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="56" y="356" font-size="13" font-weight="600" fill="#1F1E1C">1. Listens</text>
  <text x="56" y="372" font-size="11.5" font-weight="400" fill="#1F1E1C">speech to text,</text>
  <text x="56" y="388" font-size="11.5" font-weight="400" fill="#1F1E1C">as the caller talks</text>
  <rect x="216" y="332" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="232" y="356" font-size="13" font-weight="600" fill="#1F1E1C">2. Waits</text>
  <text x="232" y="372" font-size="11.5" font-weight="400" fill="#1F1E1C">until the caller</text>
  <text x="232" y="388" font-size="11.5" font-weight="400" fill="#1F1E1C">is done talking</text>
  <rect x="392" y="332" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="408" y="356" font-size="13" font-weight="600" fill="#1F1E1C">3. OpenAI model</text>
  <text x="408" y="372" font-size="11.5" font-weight="400" fill="#1F1E1C">writes the reply,</text>
  <text x="408" y="388" font-size="11.5" font-weight="400" fill="#1F1E1C">using its documents</text>
  <rect x="568" y="332" width="152" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="584" y="356" font-size="13" font-weight="600" fill="#1F1E1C">4. Speaks</text>
  <text x="584" y="372" font-size="11.5" font-weight="400" fill="#1F1E1C">text to speech,</text>
  <text x="584" y="388" font-size="11.5" font-weight="400" fill="#1F1E1C">in a set voice</text>
  <text x="478" y="444" font-size="11.5" font-weight="400" fill="#5E5D59">the agent read it</text>
  <rect x="344" y="460" width="248" height="72" rx="8" fill="#FFFFFF" stroke="#B8B5AD" stroke-width="1.25"/>
  <text x="360" y="484" font-size="13" font-weight="600" fill="#1F1E1C">Google Sheet</text>
  <text x="360" y="500" font-size="11.5" font-weight="400" fill="#1F1E1C">weekly inventory, customers, notes</text>
  <text x="360" y="516" font-size="11.5" font-weight="400" fill="#5E5D59">people edited it, code updated it</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
